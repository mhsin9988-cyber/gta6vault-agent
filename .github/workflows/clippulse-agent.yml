name: ClipPulse 24/7 YouTube Auto-Clip Agent

on:
  schedule:
    - cron: '0 21 * * *' # 16:00 (America/New_York EST, UTC-5)
    - cron: '0 22 * * *' # 17:00 (America/New_York EST, UTC-5)
    - cron: '0 23 * * *' # 18:00 (America/New_York EST, UTC-5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clip-and-upload:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node dependencies
        shell: cmd
        run: npm.cmd install

      - name: Run ClipPulse AI Clipping & Upload Agent
        shell: cmd
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SOURCE_CHANNEL_IDS: 'UCxYc7wg6otUcDb5bWxTwWqA'
          TARGET_CHANNEL_HANDLE: '@GTA6Vault3'
          CAPTION_LANGUAGE: 'en'
          CAPTION_STYLE: 'karaoke'
          CLIP_DURATION_SEC: '45'
          UPLOAD_VISIBILITY: 'public'
        run: node agent.mjs

      - name: Persist uploaded clip history
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "const fs=require('fs');if(!fs.existsSync('history.json'))process.exit(0);const content=fs.readFileSync('history.json','base64');const headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','User-Agent':'clippulse'};const url='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/contents/history.json';(async()=>{const r=await fetch(url,{headers});const cur=r.ok?await r.json():null;if(cur&&cur.content&&cur.content.replace(/\s+/g,'')===content)process.exit(0);const u=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Record uploaded Short clip',content,sha:cur?cur.sha:undefined})});if(!u.ok)throw new Error(await u.text());console.log('Saved history.json to GitHub!');})();"
