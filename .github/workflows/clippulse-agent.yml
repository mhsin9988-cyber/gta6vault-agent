name: ClipPulse 24/7 YouTube Auto-Clip Agent

on:
  schedule:
    - cron: '0 21 * * *' # 16:00 (America/New_York EST, UTC-5)
    - cron: '0 22 * * *' # 17:00 (America/New_York EST, UTC-5)
    - cron: '0 23 * * *' # 18:00 (America/New_York EST, UTC-5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clip-and-upload:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node dependencies
        shell: cmd
        run: npm.cmd install

      - name: Run ClipPulse AI Clipping & Upload Agent
        shell: cmd
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SOURCE_CHANNEL_IDS: 'UCxYc7wg6otUcDb5bWxTwWqA'
          TARGET_CHANNEL_HANDLE: '@GTA6Vault3'
          CAPTION_LANGUAGE: 'en'
          CAPTION_STYLE: 'karaoke'
          CLIP_DURATION_SEC: '45'
          UPLOAD_VISIBILITY: 'public'
        run: node agent.mjs

      - name: Persist uploaded clip history
        shell: cmd
        run: |
          git config user.name "clippulse-bot"
          git config user.email "bot@clippulse.local"
          if exist history.json git add history.json
          git diff --staged --quiet || (git commit -m "Record uploaded Short clip" && git pull --rebase && git push)
